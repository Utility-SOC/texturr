name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The ML stack (torch, sentence-transformers) is deliberately not installed: the one
      # test that needs real embeddings skips itself, and everything else uses stubs.
      - run: pip install pandas openpyxl numpy scikit-learn pytest
      - run: python -m pytest -q
